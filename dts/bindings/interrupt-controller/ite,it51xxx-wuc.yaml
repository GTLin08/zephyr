description: ITE Wake-Up Controller (WUC)
compatible: "ite,it51xxx-wuc"

include: [base.yaml]

properties:
  reg:
    required: true

  wakeup-controller:
    type: boolean
    description: |
      conveys that this node is a wakeup controller

  both-edge-trigger:
    type: boolean
    description: |
      Rising-edge or falling-edge triggered is selected.
      This property is ignored when using wakeup controller
      version 2 (CONFIG_ITE_IT51XXX_WUC_V2).

  "#wuc-cells":
    type: int
    required: true
    description: |
      number of items to expect in a wakeup controller specifier
    const: 1

wuc-cells:
  - mask
