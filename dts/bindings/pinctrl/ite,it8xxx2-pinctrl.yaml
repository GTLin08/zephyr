description: |
    The ITE IT8XXX2 pin controller is a node responsible for controlling
    pin function selection and pin properties. For example, you can
    use this node to route UART1 RX and TX setting the alternate
    function on the pin.

    The node has the 'pinctrl' node label set in your SoC's devicetree,
    so you can modify it like this:

      &pinctrl {
              /* your modifications go here */
      };

    All device pin configurations should be placed in child nodes of the
    'pinctrl' node, as shown in this example:

      /* You can put this in places like a board-pinctrl.dtsi file in
       * your board directory, or a devicetree overlay in your application.
       */

      /* include pre-defined pins and functions for the SoC used by the board */
      #include <dt-bindings/pinctrl/it8xxx2-pinctrl.h>

      &pinctrl {
        /* configuration for UART0 default state */
        pinctrl_uart1_rx: uart1_rx {
          pinmuxs = <&pinctrlb 0 IT8XXX2_PINMUX_FUNC_3>;
        };
        pinctrl_uart1_tx: uart1_tx {
          pinmuxs = <&pinctrlb 1 IT8XXX2_PINMUX_FUNC_3>;
        };
      };

    The 'pinctrl_uart1_rx' child node encodes the pin configurations
    for a particular state of a device; in this case, the default
    (that is, active) sate.

    To link pin configurations with a device, use a pinctrl-N property for some
    number N, like this example you could place in your board's DTS file:

      #include "board-pinctrl.dtsi"

      &uart0 {
        pinctrl-0 = <&pinctrl_uart1_rx &pinctrl_uart1_tx>;
        pinctrl-1 = <&pinctrl_uart1_rx_sleep &pinctrl_uart1_tx_sleep>;
        pinctrl-2 = <&pinctrl_uart1_rx_priv &pinctrl_uart1_tx_priv>;
        pinctrl-names = "default", "sleep", "priv_start";
      };

compatible: "ite,it8xxx2-pinctrl"

include:
    - name: base.yaml
    - name: pincfg-node.yaml
      child-binding:
        property-allowlist:
          - bias-high-impedance
          - bias-pull-pin-default
          - bias-pull-up
          - bias-pull-down
          - input-enable
          - input-disable
          - gpio-voltage-1p8
          - gpio-voltage-3p3

properties:
    reg:
      required: true

child-binding:
    description: |
        This binding gives a base representation of the ITE IT8XXX2 pins configration.
    properties:
        pinmuxs:
          required: true
          type: phandle-array
          description: |
              ITE IT8XXX2 pin's configuration (port, pin and function).

        gpio-voltage-3p3:
          required: false
          type: boolean
          description: |
              Input voltage selection 3.3V

        gpio-voltage-1p8:
          required: false
          type: boolean
          description: |
              Input voltage selection 1.8V
